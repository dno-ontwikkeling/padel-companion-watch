name: Release

# Semantic-version release driven by Conventional Commits, mirroring the
# dno-ontwikkeling house pattern (see claude-command-center).
#
# Commit-message → version bump (mathieudutour/github-tag-action):
#   feat: ...            → minor (1.4.0 → 1.5.0)
#   fix: ...             → patch (1.4.0 → 1.4.1)
#   BREAKING CHANGE / !  → major (1.4.0 → 2.0.0)
#   docs/chore/refactor/… → no release (default_bump: false)
#
# A push to main with no feat/fix/breaking commit produces no tag and no
# release. When a bump happens the build job produces a signed Android App
# Bundle (.aab) and attaches it to a GitHub pre-release; promote-release.yml
# uploads that bundle to Google Play and flips the release to stable.
#
# versionName is the tag without the leading v. versionCode is derived from it
# as major*10000 + minor*100 + patch, so it always increases with the version
# (1.4.1 → 10401). Minor and patch must therefore stay below 100.
#
# Signing uses the Play upload key from repository secrets:
#   KEYSTORE_BASE64  base64 of the .jks upload keystore
#   STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#
# workflow_dispatch with `version` set skips the auto-bump and releases that
# exact version — an escape hatch for when the computed tag name is unusable.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "resources/**"
      - ".claude/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version, e.g. 1.4.2 (no leading v). Empty = auto-bump from commits."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.out.outputs.new_tag }}
      new_version: ${{ steps.out.outputs.new_version }}
      changelog: ${{ steps.out.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-bump version and create tag
        id: auto
        if: ${{ github.event_name == 'push' }}
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: main

      - name: Create explicit tag
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        env:
          V: ${{ inputs.version }}
        run: |
          git tag "v$V"
          git push origin "v$V"
          echo "new_tag=v$V" >> "$GITHUB_OUTPUT"
          echo "new_version=$V" >> "$GITHUB_OUTPUT"

      - name: Consolidate outputs
        id: out
        env:
          AUTO_TAG: ${{ steps.auto.outputs.new_tag }}
          AUTO_VER: ${{ steps.auto.outputs.new_version }}
          AUTO_LOG: ${{ steps.auto.outputs.changelog }}
          MAN_TAG: ${{ steps.manual.outputs.new_tag }}
          MAN_VER: ${{ steps.manual.outputs.new_version }}
        run: |
          if [ -n "$MAN_TAG" ]; then
            echo "new_tag=$MAN_TAG" >> "$GITHUB_OUTPUT"
            echo "new_version=$MAN_VER" >> "$GITHUB_OUTPUT"
            echo "changelog=Manual release $MAN_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=$AUTO_TAG" >> "$GITHUB_OUTPUT"
            echo "new_version=$AUTO_VER" >> "$GITHUB_OUTPUT"
            {
              echo "changelog<<CHANGELOG_EOF"
              echo "$AUTO_LOG"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    if: ${{ needs.tag.outputs.new_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive versionCode from the release version
        id: version
        env:
          V: ${{ needs.tag.outputs.new_version }}
        run: |
          IFS=. read -r major minor patch <<< "$V"
          if [ "${minor:-0}" -ge 100 ] || [ "${patch:-0}" -ge 100 ]; then
            echo "::error::minor and patch must stay below 100 for the versionCode scheme"
            exit 1
          fi
          code=$(( major * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionName $V, versionCode $code"

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release bundle
        env:
          STORE_FILE: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -PversionName="${{ needs.tag.outputs.new_version }}" \
            -PversionCode="${{ steps.version.outputs.code }}"
          cp app/build/outputs/bundle/release/app-release.aab \
            "padel-companion-${{ needs.tag.outputs.new_tag }}.aab"

      # Upload to a DRAFT first (drafts stay mutable), then publish it. This is
      # required when immutable releases is on (prereleases publish on creation,
      # freezing assets before they upload) and is harmless when it is off.
      - name: Upload bundle to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: ${{ needs.tag.outputs.new_tag }}
          body: |
            ${{ needs.tag.outputs.changelog }}

            versionName `${{ needs.tag.outputs.new_version }}`, versionCode `${{ steps.version.outputs.code }}`
          prerelease: true
          draft: true
          files: padel-companion-*.aab

      - name: Publish the draft as a pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.tag.outputs.new_tag }}" --draft=false --prerelease
