name: Promote Release

# Publishes a pre-release (created by release.yml) to Google Play and then
# flips it to a stable "latest" GitHub release. Run manually from the Actions
# tab once the bundle from the pre-release has been verified.
#
# The bundle attached to the GitHub release is uploaded to the Play track in
# the PLAY_TRACK repository variable (default: wear:production, the Wear OS
# form factor track; the phone "production" track rejects watch bundles) and
# sent for review.
# Release notes are the feat/fix commit subjects since the previous tag.
#
# Play access is keyless via Workload Identity Federation; the repository
# variables WIF_PROVIDER and PLAY_SERVICE_ACCOUNT point at the Google Cloud
# pool provider and the service account invited in the Play Console.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to promote (e.g. v1.2.3). Leave empty to promote the latest pre-release."
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find pre-release
        id: pre
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          if [ -n "$tag" ]; then
            release=$(gh api repos/${{ github.repository }}/releases/tags/"$tag" 2>/dev/null) || {
              echo "::error::Release with tag $tag not found"
              exit 1
            }
          else
            release=$(gh api repos/${{ github.repository }}/releases --jq '[.[] | select(.prerelease)][0]')
          fi
          if [ "$release" = "null" ] || [ -z "$release" ]; then
            echo "::error::No pre-release found"
            exit 1
          fi
          echo "id=$(echo "$release" | jq -r '.id')" >> "$GITHUB_OUTPUT"
          echo "tag=$(echo "$release" | jq -r '.tag_name')" >> "$GITHUB_OUTPUT"

      - name: Download the bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ steps.pre.outputs.tag }}" --pattern '*.aab' --output bundle.aab

      - name: Authenticate to Google Play
        id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload to Google Play
        env:
          PLAY_TOKEN: ${{ steps.gcp.outputs.access_token }}
          TAG: ${{ steps.pre.outputs.tag }}
          TRACK: ${{ vars.PLAY_TRACK || 'wear:production' }}
        run: |
          notes=$(bash .github/scripts/play.sh notes "$TAG")
          echo "Release notes:"; echo "$notes"
          bash .github/scripts/play.sh upload bundle.aab "$TRACK" "$notes"

      - name: Promote to stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/releases/${{ steps.pre.outputs.id }} \
            --method PATCH --silent \
            --field prerelease=false \
            --field make_latest=true
          echo "Promoted ${{ steps.pre.outputs.tag }} to stable release"
